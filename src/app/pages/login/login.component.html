<h2>Iniciar Sesión</h2>

<!-- MENSAJE DE ERROR GENERAL -->
<div *ngIf="errorMessage" class="alert">
  {{ errorMessage }}
</div>

<form [formGroup]="form" (ngSubmit)="login()">

  <!-- EMAIL -->
  <div class="form-group">
    <label>Email</label>
    <input
      type="email"
      formControlName="email"
      [class.invalid]="form.get('email')?.invalid && form.get('email')?.touched"
    />

    <div class="error" *ngIf="form.get('email')?.hasError('required') && form.get('email')?.touched">
      El email es obligatorio.
    </div>

    <div class="error" *ngIf="form.get('email')?.hasError('email') && form.get('email')?.touched">
      El email no es válido.
    </div>
  </div>

  <!-- PASSWORD -->
  <div class="form-group">
    <label>Contraseña</label>
    <input
      type="password"
      formControlName="password"
      [class.invalid]="form.get('password')?.invalid && form.get('password')?.touched"
    />

    <div class="error" *ngIf="form.get('password')?.hasError('required') && form.get('password')?.touched">
      La contraseña es obligatoria.
    </div>
  </div>

  <!-- BOTÓN -->
  <button type="submit" [disabled]="form.invalid">
    Ingresar
  </button>

</form>
